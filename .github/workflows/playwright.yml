name: Production checks
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run unit and package validation
      run: npm test
    - name: Assert performance budgets
      run: npm run benchmark:assert
    - name: Run extension UI smoke tests
      run: npx playwright test --project=chromium
    - name: Verify standalone popup preview
      run: npm run popup:preview:verify
    - name: Build release package
      run: npm run release:package
    - name: Verify self-contained preview with partial host APIs
      run: npm run popup:preview:verify -- --standalone --partial-chrome
    - name: Verify critical fixes in the packaged extension
      run: npm run critical:verify -- --packaged
    - name: Verify toolbar functionality in the packaged extension
      run: npm run popup:functionality:verify -- --packaged
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: adlock-release-${{ github.sha }}
        path: |
          dist/*.zip
          dist/adlock-preview-*.html
          playwright-report/
          output/benchmarks/critical-regressions-*.json
          output/benchmarks/popup-functionality-*.json
        retention-days: 30
